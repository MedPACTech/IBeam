name: Publish Production Packages

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to publish, for example v2.0.61.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  resolve-release:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.tag }}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable package publishing requires a semver tag like v2.0.61. Got '$tag'." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve-release
    uses: ./.github/workflows/_nuget-publish.yml
    with:
      dotnet-version: ${{ vars.DOTNET_VERSION || '10.0.x' }}
      configuration: ${{ vars.BUILD_CONFIGURATION || 'Release' }}
      package-version: ${{ needs.resolve-release.outputs.version }}
      ref: ${{ needs.resolve-release.outputs.tag }}
      environment-name: production
      nuget-source: ${{ vars.NUGET_SOURCE || 'https://api.nuget.org/v3/index.json' }}
    secrets: inherit
