name: Reusable .NET Build

on:
  workflow_call:
    inputs:
      solution:
        description: Solution or project to restore, build, test, and pack.
        required: false
        type: string
        default: IBeam.sln
      dotnet-version:
        description: .NET SDK version.
        required: false
        type: string
        default: 10.0.x
      configuration:
        description: Build configuration.
        required: false
        type: string
        default: Release
      run-tests:
        description: Run dotnet test.
        required: false
        type: boolean
        default: true
      pack:
        description: Create NuGet package artifacts.
        required: false
        type: boolean
        default: true
      artifact-name:
        description: Name for uploaded package artifacts.
        required: false
        type: string
        default: nupkgs

permissions:
  contents: read

jobs:
  build:
    name: Build, Test, Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore "${{ inputs.solution }}"

      - name: Build
        run: dotnet build "${{ inputs.solution }}" --configuration "${{ inputs.configuration }}" --no-restore

      - name: Test
        if: ${{ inputs.run-tests }}
        run: dotnet test "${{ inputs.solution }}" --configuration "${{ inputs.configuration }}" --no-build

      - name: Pack
        if: ${{ inputs.pack }}
        run: dotnet pack "${{ inputs.solution }}" --configuration "${{ inputs.configuration }}" --no-build --output ./artifacts/packages

      - name: Upload package artifacts
        if: ${{ inputs.pack }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
