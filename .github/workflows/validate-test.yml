name: Validate Test

on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/_dotnet-build.yml
    with:
      dotnet-version: ${{ vars.DOTNET_VERSION || '10.0.x' }}
      configuration: ${{ vars.BUILD_CONFIGURATION || 'Release' }}
      artifact-name: test-nupkgs
