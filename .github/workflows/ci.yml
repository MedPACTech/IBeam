name: Validate Build

on:
  workflow_dispatch:
    inputs:
      run-tests:
        description: Run tests.
        required: false
        type: boolean
        default: true
      pack:
        description: Create package artifacts.
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/_dotnet-build.yml
    with:
      dotnet-version: ${{ vars.DOTNET_VERSION || '10.0.x' }}
      configuration: ${{ vars.BUILD_CONFIGURATION || 'Release' }}
      run-tests: ${{ inputs.run-tests }}
      pack: ${{ inputs.pack }}
      artifact-name: manual-validation-nupkgs
